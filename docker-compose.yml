services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ~/.ssh:/root/.ssh:ro
    environment:
      - DJANGO_SETTINGS_MODULE=PanelControl.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis

  worker:
    build: .
    command: python -m celery -A PanelControl worker -l info
    env_file:
      - .env
    volumes:
      - .:/app
      - ~/.ssh:/root/.ssh:ro
    environment:
      - DJANGO_SETTINGS_MODULE=PanelControl.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
