version: "3.9"

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ~/.ssh:/root/.ssh:ro  # IMPORTANTE: Comparte tus llaves SSH con el contenedor
    environment:
      - DJANGO_SETTINGS_MODULE=PanelControl.settings
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=panelcontrol
      - DB_USER=paneluser
      - DB_PASSWORD=panelpass
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=panelcontrol
      - POSTGRES_USER=paneluser
      - POSTGRES_PASSWORD=panelpass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data: